name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Python tests and source check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_MODE: local
      AUTH_ALLOW_DEV_LOGIN: "false"
      OPENAI_API_KEY: ""
      AI_EXPLANATIONS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check tracked files for obvious secrets
        run: python scripts/security_check.py
      - name: Run offline Python tests
        run: python -m pytest -q
      - name: Install Python vulnerability auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --progress-spinner off

  frontend:
    name: Frontend lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit npm dependencies (high and critical)
        run: npm audit --audit-level=high
      - name: Test outreach draft generation
        run: npm run test:draft
      - name: Test profile save queue
        run: npm run test:profile
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
